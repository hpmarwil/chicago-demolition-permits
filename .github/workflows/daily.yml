name: Chicago Demolition Permit Tracker

on:
  schedule:
    - cron: '15 7 * * *'
      timezone: "America/Chicago"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Run the scraper
        run: python scraper.py

      - name: Save updated files
        run: |
          git config user.name "Chicago Permit Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen_ids.txt
          git add new_permits_*.csv
          git commit -m "Update demolition permits" || echo "No new permits to save"
          git push
